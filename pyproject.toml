[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boogie-woogie-musicgen"
version = "0.1.0"
description = "Boogie-Woogie music generation with MusicGen and a MIDI character LSTM"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
musicgen = [
  "numpy>=1.26",
  "soundfile>=0.12",
  "torch>=2.2",
  "transformers>=4.45,<6",
]
app = ["gradio>=5,<7"]
symbolic = ["mido>=1.3,<2", "torch>=2.2"]
symbolic-modern = ["miditok>=3.1,<4"]

[project.scripts]
boogie-woogie-generate = "boogie_woogie_musicgen.cli:main"
boogie-woogie-app = "boogie_woogie_musicgen.app:main"

[tool.setuptools.packages.find]
where = ["src"]
